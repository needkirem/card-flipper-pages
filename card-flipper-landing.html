<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flipper - Language Learning App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            margin-bottom: 30px;
        }

        .app-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            display: block;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            color: white;
            font-size: 3rem;
            font-weight: 300;
        }

        .app-badges {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            border-radius: 12px;
            overflow: hidden;
            width: 200px;
            height: 60px;
        }

        .badge:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .badge img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .app-store-badge {
            padding-left: 35px;
            padding-right: 35px;
        }

        .ru-store-badge {
            padding-left: 35px;
            padding-right: 35px;
        }

        @media (max-width: 768px) {
            .app-icon {
                width: 110px;
                height: 110px;
            }

            .app-badges {
                flex-direction: column;
            }

            .header h1 {
                font-size: 2.2rem;
            }

            .badge {
                width: 180px;
                height: 55px;
            }

            .app-store-badge {
                padding-left: 28px;
                padding-right: 28px;
            }

            .ru-store-badge {
                padding-left: 28px;
                padding-right: 28px;
            }
        }

        @media (max-width: 480px) {
            .app-icon {
                width: 100px;
                height: 100px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .badge {
                width: 160px;
                height: 50px;
            }

            .app-store-badge {
                padding-left: 24px;
                padding-right: 24px;
            }

            .ru-store-badge {
                padding-left: 24px;
                padding-right: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="assets/app-icon.png" alt="Card Flipper" class="app-icon">
            <h1>Card Flipper</h1>
        </div>

        <div class="app-badges">
            <a href="https://play.google.com/store/apps/details?id=com.needkirem.cardflipper" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="badge google-play-badge">
                <img src="assets/google-play-badge.svg" 
                     alt="Get it on Google Play">
            </a>

            <a href="https://www.rustore.ru/catalog/app/com.needkirem.cardflipper" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="badge ru-store-badge">
                <img src="assets/ru-store-badge.svg" 
                     alt="Download from RuStore">
            </a>

            <a href="https://apps.apple.com/us/app/card-flipper-language-learning/id6753706027" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="badge app-store-badge">
                <img src="assets/app-store-badge.svg" 
                     alt="Download on the App Store">
            </a>
        </div>
    </div>
</body>
</html>
